[project]
name = "self-instructed-cot-controllability"
version = "0.1.0"
description = "Evaluation suite for Self-Instructed Chain-of-Thought Controllability in reasoning models."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Uriel Dolev", email = "urieldolev2005@gmail.com" },
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "aiohttp",
    "openai",
    "pandas",
    "python-dotenv",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
agent = [
    "inspect-ai @ git+https://github.com/UKGovernmentBEIS/inspect_ai@e8c8ce4ecd39563ca5d99dbd10f59ebabcba6c9a",
    "inspect-evals[swe_bench] @ git+https://github.com/UKGovernmentBEIS/inspect_evals@b816b3de9682777a7c354d1d764c5c44ba89c52e",
    "datasets>=4.7",
    "docker",
    "openai>=2.26",
]
vllm = [
    "vllm==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["SICC-QA", "SICC-Agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
conflicts = [[{ extra = "agent" }, { extra = "vllm" }]]
override-dependencies = ["datasets>=4.7"]
